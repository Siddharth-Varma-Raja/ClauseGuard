server:
  port: 8081

spring:
  application:
    name: stayops-identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stayops_identity}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect