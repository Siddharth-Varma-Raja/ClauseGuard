# Firebase App Hosting settings for the ClauseGuard frontend
# (project clauseguard-512316, backend clauseguard-web).
#
# NEXT_PUBLIC_ values are baked into the site at build time, so each one needs
# BUILD availability. They are public (every visitor's browser receives them):
# never put secrets such as API keys for Gemini, database passwords or
# service-account keys in this file.

runConfig:
  minInstances: 0 # set 1 on demo days to avoid cold starts
  maxInstances: 2
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_API_URL
    value: https://api.clauseguard.ie/api
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCJ5FGvVeIDMQye_aXnbcnS3_KVInei9KI
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: clauseguard-512316.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: clauseguard-512316
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: clauseguard-512316.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "302955202182"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:302955202182:web:9f61cf519d6b05458df307
    availability:
      - BUILD
      - RUNTIME
